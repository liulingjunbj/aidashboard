<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞象AI作文星</title>
  <style>
    :root{--blue:#2f79f5;--cyan:#45bdf4;--ink:#1d2638;--sub:#65718a;--line:#e8edf5;--nav:#f4f7fd;--soft:#f8faff}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#fff}
    body{overflow:hidden}
    a{color:inherit;text-decoration:none}
    button{font:inherit}

    .shell{height:100vh;display:grid;grid-template-columns:128px minmax(0,1fr)}
    .sidebar{padding:18px 10px 14px;background:linear-gradient(180deg,#f7f9fe,#f1f5fc);border-right:1px solid #e7ecf5;display:flex;flex-direction:column}
    .logo{width:38px;height:38px;margin:0 0 20px 5px;border-radius:12px;background:linear-gradient(145deg,#2d77f6,#43b7f2);box-shadow:0 9px 20px rgba(47,121,245,.22);position:relative}
    .logo:before,.logo:after{content:"";position:absolute;background:#fff;border-radius:7px 2px 7px 2px}.logo:before{width:9px;height:22px;left:9px;top:8px}.logo:after{width:16px;height:8px;right:6px;top:8px}
    .nav{display:grid;gap:5px}
    .nav-item{height:44px;padding:0 11px;display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:10px;color:#687a9a;font-size:13px;transition:.2s}
    .nav-item:hover{color:#2c6fe7;background:rgba(255,255,255,.78);border-color:#e6edf8}
    .nav-item.active{color:#fff;background:linear-gradient(135deg,#347af6,#4caef2);box-shadow:0 8px 18px rgba(47,121,245,.22);font-weight:650}
    .nav-item.cockpit{margin-top:4px;color:#315fc9;background:#fff;border-color:#dbe5f8;box-shadow:0 7px 18px rgba(64,90,145,.08);font-weight:650}
    .nav-item.cockpit:hover{color:#fff;background:linear-gradient(135deg,#346ff0,#7063ee);transform:translateY(-1px)}
    .nav-icon{width:18px;height:18px;display:grid;place-items:center;font-size:16px;line-height:1}
    .spacer{flex:1}
    .assistant-entry{height:34px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #e0e7f3;border-radius:10px;background:#fff;color:#4f678b;font-size:11px}
    .assistant-entry i{color:#2f7af6;font-style:normal}
    .user{margin-top:11px;padding:0 4px;display:flex;align-items:center;gap:8px;color:#60708a;font-size:12px}.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#27bdf1 0 52%,#2e69ee 52%)}

    .main{min-width:0;position:relative;padding:38px 56px 44px;overflow:auto;background:radial-gradient(circle at 73% 14%,rgba(61,175,244,.08),transparent 22%),#fff}
    .main-inner{width:min(1120px,100%);margin:0 auto;padding-top:150px}
    .welcome{margin:0 0 60px;font-size:26px;line-height:1.35;letter-spacing:.01em}.welcome b{font-weight:800}
    .primary-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .hero-card{height:248px;border-radius:24px;overflow:hidden;position:relative}
    .assign{padding:34px 36px;background:linear-gradient(135deg,#f4f7ff,#eef2ff)}
    .assign:after{content:"";position:absolute;right:40px;bottom:-34px;width:155px;height:220px;border:1px solid rgba(255,255,255,.9);border-radius:22px;transform:rotate(18deg);background:linear-gradient(145deg,rgba(255,255,255,.75),rgba(77,122,244,.34));box-shadow:-40px 26px 0 -2px rgba(49,126,247,.72),-78px 54px 0 -4px rgba(255,255,255,.88)}
    .review{padding:34px 24px;background:linear-gradient(135deg,#effcf9,#ddfaf5)}
    .hero-card h2{position:relative;z-index:2;margin:0 0 14px;font-size:28px}.hero-card p{position:relative;z-index:2;margin:0;color:#313b50;font-size:14px}
    .assign button{position:absolute;z-index:2;left:36px;bottom:34px;width:132px;height:48px;border:0;border-radius:999px;background:#fff;color:#263149;font-weight:650;cursor:pointer;box-shadow:0 8px 22px rgba(75,100,145,.06)}
    .review-box{position:absolute;left:18px;right:18px;bottom:12px;height:148px;padding:25px 22px;border-radius:18px;background:rgba(255,255,255,.88);box-shadow:0 12px 34px rgba(47,128,109,.07)}
    .review-box span{display:block;font-size:13px}.pending{position:absolute;left:22px;bottom:21px;color:#2e78f5;font-weight:700}.pending b{font-size:23px;margin-right:5px}.pending i{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:4px;border-radius:50%;background:#2e78f5;color:#fff;font-style:normal;font-size:10px}
    .quick-grid{margin-top:44px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
    .quick{height:100px;border:1px solid #f1f3f8;border-radius:18px;background:#fafbfe;display:flex;align-items:center;justify-content:center;gap:13px;font-size:16px;font-weight:650;transition:.22s;box-shadow:0 9px 24px rgba(71,91,130,.025)}
    .quick:hover{transform:translateY(-3px);border-color:#dce7f8;background:#fff;box-shadow:0 16px 34px rgba(60,88,140,.09)}
    .quick i{width:25px;height:25px;display:grid;place-items:center;color:#28354b;font-style:normal;font-size:23px;font-weight:400}
    .tip{position:absolute;right:34px;top:28px;padding:8px 12px;border:1px solid #e4eaf4;border-radius:999px;background:rgba(255,255,255,.86);color:#7b879c;font-size:11px;backdrop-filter:blur(10px)}
    @media(max-width:1050px){.shell{grid-template-columns:106px 1fr}.sidebar{padding-inline:7px}.nav-item{padding:0 7px;gap:7px;font-size:11px}.main{padding-inline:30px}.main-inner{padding-top:90px}.quick-grid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="产品导航">
      <div class="logo" aria-label="飞象教育"></div>
      <nav class="nav">
        <a class="nav-item" href="#"><i class="nav-icon">□</i><span>作业</span></a>
        <a class="nav-item active" href="#"><i class="nav-icon">◈</i><span>作文星</span></a>
        <a class="nav-item" href="#"><i class="nav-icon">▱</i><span>学练机</span></a>
        <a class="nav-item" href="#"><i class="nav-icon">▣</i><span>学习机</span></a>
        <a class="nav-item" href="#"><i class="nav-icon">▤</i><span>直播</span></a>
        <a class="nav-item" href="#"><i class="nav-icon">▥</i><span>教务</span></a>
        <a class="nav-item" href="#"><i class="nav-icon">⌁</i><span>巡课</span></a>
        <a class="nav-item" href="#"><i class="nav-icon">▧</i><span>墨水屏</span></a>
        <a class="nav-item" href="#"><i class="nav-icon">⌂</i><span>学校数据</span></a>
        <a class="nav-item cockpit" href="./business-panorama.html"><i class="nav-icon">◫</i><span>驾驶舱</span></a>
        <a class="nav-item" href="#"><i class="nav-icon">?</i><span>帮助中心</span></a>
      </nav>
      <div class="spacer"></div>
      <div class="assistant-entry"><i>✦</i><span>飞象智能助手</span></div>
      <div class="user"><span class="avatar"></span><span>李飞</span></div>
    </aside>

    <main class="main">
      <span class="tip">作文 / 作业统一业务入口</span>
      <div class="main-inner">
        <h1 class="welcome"><b>李老师，</b>欢迎使用飞象AI作文星</h1>

        <section class="primary-grid">
          <article class="hero-card assign">
            <h2>布置作文</h2>
            <p>下载飞象作文纸，智能批改学生作文</p>
            <button type="button">立即布置</button>
          </article>
          <article class="hero-card review">
            <h2>批改作文</h2>
            <div class="review-box">
              <span>第一单元　我的心爱之物</span>
              <div class="pending"><b>3</b>份批改待确认<i>›</i></div>
            </div>
          </article>
        </section>

        <section class="quick-grid">
          <a class="quick" href="#"><i>▱</i><span>我的作文</span></a>
          <a class="quick" href="#"><i>♙</i><span>我的学生</span></a>
          <a class="quick" href="#"><i>□</i><span>范文库</span></a>
          <a class="quick" href="#"><i>⇩</i><span>下载作文纸</span></a>
          <a class="quick" href="#"><i>▣</i><span>体验智能辅导</span></a>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
